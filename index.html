<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Morning 🤍</title>
<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#fff1f2,#f0f9ff);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
  width:90%;
  max-width:400px;
  animation:fadeIn .6s ease;
}

h2{margin-bottom:10px}

button{
  padding:10px 16px;
  margin:6px;
  border:none;
  border-radius:20px;
  background:#111;
  color:white;
  cursor:pointer;
}

.cartoon{
  font-size:50px;
  position:relative;
}

#walker{
  position:absolute;
  left:-60px;
  animation:walk 3s linear forwards;
}

@keyframes walk{
  from{left:-60px}
  to{left:60px}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.hidden{display:none}
</style>
</head>

<body>

<div class="card">

<div class="cartoon">
  <span id="walker">🐥</span>
  <span id="sleeper">🐻💤</span>
</div>

<p id="wakeText" class="hidden">utho utho 😤</p>

<h2>Good Morning Dumboo 🤍</h2>
<p>kitna sougi 😄</p>

<div>
<p><b>ab kya karogi?</b></p>
<button onclick="reply()">Jhadu</button>
<button onclick="reply()">Pocha</button>
<button onclick="reply()">Bartan</button>
</div>

<p id="ans" class="hidden">Good choice 😏 ab kaam shuru karo 🤍</p>

<div style="margin-top:12px">
  <p>Reply bhi kar do na 🤍</p>
  <textarea id="replyBox" placeholder="yahan likho..." style="width:100%;height:80px;padding:10px;border-radius:10px;border:1px solid #ccc;font-family:inherit"></textarea>
  <br>
  <button onclick="sendReply()">Send</button>
  <p id="sentMsg" class="hidden" style="margin-top:6px">Reply sent 🤍</p>
</div>

</div>

<script>
setTimeout(()=>{
  document.getElementById('wakeText').classList.remove('hidden');
},2000);

function reply(){
  document.getElementById('ans').classList.remove('hidden');
}
function sendReply(){
  const text=document.getElementById('replyBox').value;
  if(!text) return;
  document.getElementById('sentMsg').classList.remove('hidden');
  const subject = encodeURIComponent("Good Morning Reply");
  const body = encodeURIComponent(text);
  window.location.href = `mailto:aayushsethiya2509@gmail.com?subject=${subject}&body=${body}`;
}
</script>

</body>
</html>
