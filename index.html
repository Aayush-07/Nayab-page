<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry 🤍</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #ffffff, #fff5f5);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Center content */
.container {
    text-align: center;
    z-index: 2;
}

/* Main text */
h1 {
    font-size: 70px;
    color: #444;
    margin-bottom: 20px;
}

p {
    font-size: 26px;
    color: #333;
    font-style: italic;
    max-width: 600px;
}

/* Flower animation */
.flower {
    position: absolute;
    top: -50px;
    font-size: 28px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Sorry 🤍</h1>
    <p>
        Tumse badhkar hai kya?<br>
        Tumhare liye to bagicha kharid lu 😏
    </p>
</div>

<script>
const flowers = ["🌹", "🌻", "🌸", "💐"];

function createFlower() {
    const flower = document.createElement("div");
    flower.classList.add("flower");
    flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];

    flower.style.left = Math.random() * window.innerWidth + "px";
    flower.style.animationDuration = (3 + Math.random() * 5) + "s";

    document.body.appendChild(flower);

    setTimeout(() => {
        flower.remove();
    }, 8000);
}

setInterval(createFlower, 200);
</script>

</body>
</html>
